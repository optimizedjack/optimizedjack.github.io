<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunday</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --yellow: #ffde59;
    --font: 'Helvetica Neue', Helvetica, -apple-system, sans-serif;
  }

  html, body {
    height: 100%; background: #fffef9;
    font-family: var(--font); overflow: hidden;
  }

  .bg { position: fixed; inset: 0; z-index: 0; }
  .blob { position: absolute; border-radius: 50%; }
  .blob-1 { width:700px;height:700px;background:radial-gradient(circle,#ffde5955,#ffde5910);filter:blur(100px);top:-20%;left:-20%;animation:d1 20s ease-in-out infinite; }
  .blob-2 { width:600px;height:600px;background:radial-gradient(circle,#ff575725,#ff575708);filter:blur(110px);bottom:-15%;right:-15%;animation:d2 26s ease-in-out infinite; }
  .blob-3 { width:450px;height:450px;background:radial-gradient(circle,#7ed95720,#7ed95708);filter:blur(90px);top:40%;left:40%;animation:d3 18s ease-in-out infinite; }
  @keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,50px)}}
  @keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,-60px)}}
  @keyframes d3{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,50px)}}
  @media(prefers-reduced-motion:reduce){.blob{animation:none}}

  .center {
    position: relative; z-index: 1;
    height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px;
  }

  .sun { font-size: 28px; opacity: 0.85; }

  .wordmark {
    font-size: clamp(64px, 16vw, 160px);
    font-weight: 200;
    letter-spacing: 0.08em;
    color: var(--yellow);
    text-shadow: 0 4px 60px rgba(255,222,89,0.3);
    line-height: 1;
  }

  .tagline {
    font-size: 15px; font-weight: 400;
    color: rgba(26,26,26,0.45);
    letter-spacing: 0.01em;
    margin-top: 4px;
  }

  .btn {
    margin-top: 32px;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 28px; border-radius: 14px;
    font-size: 14px; font-weight: 500; font-family: var(--font);
    text-decoration: none; color: #1a1a1a;
    background: var(--yellow);
    box-shadow: 0 4px 24px rgba(255,222,89,0.35), inset 0 1px 0 rgba(255,255,255,0.5);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(255,222,89,0.45); }
</style>
</head>
<body>
<div class="bg">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>
<div class="center">
  <span class="sun">☀</span>
  <h1 class="wordmark">sunday</h1>
  <p class="tagline">A creative assistant with a point of view.</p>
  <a href="https://github.com/optimizedjack/sunday" class="btn">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
    </svg>
    View on GitHub
  </a>
</div>
</body>
</html>
